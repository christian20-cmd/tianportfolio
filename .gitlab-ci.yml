stages:
  - build
  - deploy

# ---------- FRONTEND : build + déploiement sur GitLab Pages ----------
pages:
  stage: deploy
  image: node:20
  rules:
    - changes:
        - frontend/**/*
      if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd frontend
    - echo "VITE_API_URL=$VITE_API_URL" > .env
    - echo "VITE_UPLOADS_URL=$VITE_UPLOADS_URL" >> .env
    - npm install
    - npm run build
    - cp -r dist ../public
  artifacts:
    paths:
      - public
  cache:
    paths:
      - frontend/node_modules/

# ---------- BACKEND : déclenche un déploiement sur Render ----------
deploy_backend:
  stage: deploy
  image: alpine:latest
  rules:
    - changes:
        - backend/**/*
      if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache curl
    - curl -X POST "$RENDER_DEPLOY_HOOK_URL"